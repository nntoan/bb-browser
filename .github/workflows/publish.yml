name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      registry_url:
        required: false
        type: string
        default: https://registry.npmjs.org
      dist_tag:
        required: false
        type: string
        default: latest
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. bb-browser-v0.10.0)"
        required: true
        type: string
      registry_url:
        description: "NPM registry URL (e.g. https://registry.npmjs.org or https://npm.pkg.github.com)"
        required: false
        default: "https://registry.npmjs.org"
        type: string
      dist_tag:
        description: "NPM dist-tag (e.g. latest, next)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: ${{ inputs.registry_url || 'https://registry.npmjs.org' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package extension
        run: |
          cd extension
          zip -r "../bb-browser-extension-${{ inputs.tag_name }}.zip" .

      - name: Upload extension asset
        run: gh release upload "${{ inputs.tag_name }}" "bb-browser-extension-${{ inputs.tag_name }}.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --public --no-git-checks --registry "${{ inputs.registry_url || 'https://registry.npmjs.org' }}" --tag "${{ inputs.dist_tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
